name: Build macOS
on:
  push:
    branches: ['codex/macos-build']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - shell: bash
        run: set -o pipefail; npm ci 2>&1 | tee -a build.log
      - shell: bash
        run: set -o pipefail; node --test scripts/test-macos.cjs scripts/test-update.cjs scripts/test-core-catalog.cjs scripts/test-mac-updates.cjs scripts/test-license.cjs scripts/test-activity.cjs scripts/test-notes-api.cjs scripts/test-bulk-cleanup.cjs scripts/test-mullvad.cjs scripts/test-mac-mullvad-lifecycle.cjs scripts/test-profile-settings.cjs 2>&1 | tee -a build.log
      - name: Verify native Mullvad Browser 16.0.3
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -target "$(uname -m)-apple-macos11.0" scripts/mac-window-state.swift -o assets/mac-window-state
          node scripts/smoke-mac-mullvad-lifecycle.cjs 2>&1 | tee -a build.log
          MULLVAD_TEMP=$(mktemp -d)
          mkdir "$MULLVAD_TEMP/mount"
          trap 'hdiutil detach "$MULLVAD_TEMP/mount" -quiet || true; rm -rf "$MULLVAD_TEMP"' EXIT
          curl --fail --location --retry 3 --output "$MULLVAD_TEMP/browser.dmg" https://github.com/mullvad/mullvad-browser/releases/download/16.0.3/mullvad-browser-macos-16.0.3.dmg
          hdiutil attach -readonly -nobrowse -mountpoint "$MULLVAD_TEMP/mount" "$MULLVAD_TEMP/browser.dmg"
          ditto "$MULLVAD_TEMP/mount/Mullvad Browser.app" "$MULLVAD_TEMP/Mullvad Browser.app"
          MULLVAD_APP="$MULLVAD_TEMP/Mullvad Browser.app"
          codesign --verify --deep --strict "$MULLVAD_APP"
          SV_MULLVAD_TEST_EXE="$MULLVAD_APP/Contents/MacOS/mullvadbrowser" node scripts/smoke-mullvad.cjs 2>&1 | tee -a build.log
      - run: node scripts/make-mac-icons.cjs
      - shell: bash
        run: set -o pipefail; node scripts/smoke-macos.cjs 2>&1 | tee -a build.log
      - shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if npm run build:mac 2>&1 | tee -a build.log; then exit 0; fi
            echo "Retrying macOS packaging after attempt $attempt" | tee -a build.log
            sleep 5
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - shell: bash
        run: set -o pipefail; node scripts/smoke-mac-app.cjs 2>&1 | tee -a build.log
      - name: Create download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="mac-v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "SV Browser macOS ${VERSION}" --notes "macOS Intel and Apple Silicon builds. Unsigned preview; Chrome profile smoke tests run on native macOS runners." || gh release view "$TAG"
          gh release upload "$TAG" dist-mac/${{ matrix.arch }}/*.dmg dist-mac/${{ matrix.arch }}/*.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: SV-Browser-mac-${{ matrix.arch }}
          path: |
            dist-mac/**/*.dmg
            dist-mac/**/*.zip
            dist-mac/**/*.yml
      - name: Record build result
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          RESULT_DIR=$(mktemp -d)
          cd "$RESULT_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'status=%s\narch=%s\ncommit=%s\nrun=https://github.com/%s/actions/runs/%s\n' "$BUILD_STATUS" "$BUILD_ARCH" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > result.txt
          if [[ -f "$GITHUB_WORKSPACE/build.log" ]]; then tail -n 180 "$GITHUB_WORKSPACE/build.log" > build.log; fi
          git add result.txt build.log
          git commit -m "Record macOS build result"
          git -c http.https://github.com/.extraheader="$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)" push --force "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/codex/macos-result-${{ matrix.arch }}
